[project]
name = "finsight"
version = "0.1.0"
description = "FinSight - a RAG system for financial documents (annual reports, earnings transcripts, filings)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"frontend/app.py" = ["E402"]
"scripts/*.py" = ["E402"]
"src/finsight/prompts/templates.py" = ["E501"]
